spring.profiles.active=dev

server.port=8081

# --- Configuraci贸n de la API de Scraping ---
# Usa una variable de entorno en producci贸n para m谩s seguridad.
scraper.api.key=${SCRAPER_API_KEY:dummy-key-for-dev}
scraper.timeout=60000
scraper.max.retries=2

# --- Configuraci贸n de Cach茅 (Caffeine) ---
spring.cache.cache-names=players,teams,future-matches
spring.cache.caffeine.spec=maximumSize=500,expireAfterWrite=1h

# --- Habilitar logging de depuraci贸n para nuestros servicios ---
logging.level.com.dapp.scraper_service.service=DEBUG

# Forzar par谩metros en compilaci贸n
spring.jpa.properties.hibernate.query.plan_cache_max_size=128
spring.jpa.properties.hibernate.query.plan_parameter_metadata_max_size=128

# Formatear JSON en responses
spring.jackson.serialization.indent-output=true
spring.jackson.serialization.write-dates-as-timestamps=false
spring.jackson.default-property-inclusion=non_null

# Logging
logging.level.org.springframework=WARN
logging.level.com.dapp.scraper_service=INFO

management.endpoints.web.exposure.include=health,info,metrics,env,prometheus,beans,mappings
management.endpoints.web.base-path=/monitoring
management.endpoint.health.show-details=always
management.endpoint.metrics.access=unrestricted

info.app.name=Scraper Service API
info.app.version=1.0.0
info.app.description=Sistema de gesti髇 deportiva - Entrega 3
info.app.team=Grupo M
info.app.features=JWT,Scraper Integration,Actuator Endpoints